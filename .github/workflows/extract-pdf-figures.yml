name: Extract PDF figure candidates

on:
  workflow_dispatch:
  schedule:
    # 05:17 KST every day. The offset avoids common top-of-hour congestion.
    - cron: "17 20 * * *"

permissions:
  contents: write

concurrency:
  group: pdf-figure-candidates-main
  cancel-in-progress: false

env:
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ONLY_BINARY: ":all:"
  YOLO_PDF_QUEUE_URL: ${{ vars.YOLO_PDF_QUEUE_URL || 'https://script.google.com/macros/s/AKfycbwIGwxw0JYs7DZdGKzG8p3d8PpVTaWwq4N5AtCjOGoiz6y4knPs05h3_jqCpaCMj5Dq/exec?mode=pdf-queue' }}

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: automation/pdf-figure-worker/requirements.txt

      - name: Validate configuration
        shell: bash
        run: |
          if [[ "$YOLO_PDF_QUEUE_URL" != https://* ]]; then
            echo "YOLO_PDF_QUEUE_URL must use HTTPS." >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          requirements = Path("automation/pdf-figure-worker/requirements.txt")
          entries = []
          for raw_line in requirements.read_text(encoding="utf-8").splitlines():
              line = raw_line.partition("#")[0].strip()
              if line:
                  entries.append(line)

          exact_pin = re.compile(
              r"[A-Za-z0-9_.-]+(?:\[[A-Za-z0-9_,.-]+\])?==[A-Za-z0-9_.+!-]+"
          )
          invalid = [entry for entry in entries if not exact_pin.fullmatch(entry)]
          if not entries or invalid:
              raise SystemExit(
                  "requirements.txt must contain only exact == pins; invalid: "
                  + repr(invalid)
              )
          PY

      - name: Install pinned dependencies
        run: >-
          python -m pip install --no-deps
          --requirement automation/pdf-figure-worker/requirements.txt

      - name: Run worker tests
        run: >-
          python -m unittest discover
          -s automation/pdf-figure-worker/tests
          -p "test_*.py"

      - name: Extract candidates
        run: >-
          python automation/pdf-figure-worker/extract_figures.py
          --queue-url "$YOLO_PDF_QUEUE_URL"
          --output automation/pdf-figure-worker/output/candidates.json
          --assets-dir assets/yolo-research/auto

      - name: Validate generated changes
        shell: bash
        run: |
          test -f automation/pdf-figure-worker/output/candidates.json
          test ! -L automation/pdf-figure-worker/output
          test ! -L automation/pdf-figure-worker/output/candidates.json
          test ! -L assets/yolo-research/auto
          python -m json.tool automation/pdf-figure-worker/output/candidates.json >/dev/null
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import warnings
          from PIL import Image

          allowed_file = "automation/pdf-figure-worker/output/candidates.json"
          allowed_dir = "assets/yolo-research/auto/"

          def paths_from(command):
              output = subprocess.check_output(command)
              return {
                  os.fsdecode(item)
                  for item in output.split(b"\0")
                  if item
              }

          changed = paths_from(["git", "diff", "--name-only", "-z"])
          changed |= paths_from(["git", "diff", "--cached", "--name-only", "-z"])
          changed |= paths_from(["git", "ls-files", "--others", "-z"])
          unexpected = sorted(
              path
              for path in changed
              if path != allowed_file and not path.startswith(allowed_dir)
          )
          if unexpected:
              raise SystemExit(
                  "Worker changed files outside the allowed output paths:\n"
                  + "\n".join(unexpected)
              )

          assets = Path(allowed_dir)
          output = Path(allowed_file)
          root_symlinks = [path for path in (output, assets) if path.is_symlink()]
          if root_symlinks:
              raise SystemExit(
                  "Generated outputs must not be symbolic links:\n"
                  + "\n".join(str(path) for path in root_symlinks)
              )
          generated = list(assets.rglob("*")) if assets.exists() else []
          symlinks = sorted(
              str(path)
              for path in generated
              if path.is_symlink()
          )
          if symlinks:
              raise SystemExit(
                  "Generated outputs must not contain symbolic links:\n"
                  + "\n".join(symlinks)
              )

          asset_files = [path for path in generated if path.is_file()]
          allowed_suffixes = {".jpeg", ".jpg", ".png", ".webp"}
          invalid_assets = sorted(
              str(path)
              for path in asset_files
              if path.suffix.lower() not in allowed_suffixes
          )
          if invalid_assets:
              raise SystemExit(
                  "Generated asset has a disallowed file type:\n"
                  + "\n".join(invalid_assets)
              )

          too_large = sorted(
              str(path) for path in asset_files if path.stat().st_size > 10 * 1024 * 1024
          )
          if too_large:
              raise SystemExit(
                  "Generated asset exceeds 10 MiB:\n" + "\n".join(too_large)
              )
          if output.stat().st_size > 5 * 1024 * 1024:
              raise SystemExit("candidates.json exceeds 5 MiB")
          import json
          payload = json.loads(output.read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or not isinstance(payload.get("candidates"), list):
              raise SystemExit("candidates.json must contain a candidates array")
          if len(payload["candidates"]) > 50:
              raise SystemExit("candidates.json exceeds the 50-candidate limit")

          expected_prefix = (
              "https://raw.githubusercontent.com/suhyoung89pro/"
              "suhyoung89pro.github.io/main/assets/yolo-research/auto/"
          )
          invalid_references = []
          referenced_names = set()
          required_fields = {
              "paperId",
              "paperUrl",
              "imageUrl",
              "sourceUrl",
              "license",
              "figureLabel",
          }
          for index, candidate in enumerate(payload["candidates"]):
              if not isinstance(candidate, dict):
                  invalid_references.append(f"candidate {index}: not an object")
                  continue
              missing_fields = sorted(
                  field
                  for field in required_fields
                  if not isinstance(candidate.get(field), str) or not candidate[field].strip()
              )
              if missing_fields or candidate.get("license") != "CC BY 4.0":
                  invalid_references.append(
                      f"candidate {index}: missing/invalid fields {missing_fields!r}"
                  )
                  continue
              image_url = candidate["imageUrl"]
              if not image_url.startswith(expected_prefix):
                  invalid_references.append(f"candidate {index}: {image_url!r}")
                  continue
              name = image_url.removeprefix(expected_prefix)
              if "/" in name or not re.fullmatch(r"figure-[0-9a-f]{20}\.webp", name):
                  invalid_references.append(f"candidate {index}: {image_url!r}")
                  continue
              referenced_names.add(name)
          if invalid_references:
              raise SystemExit(
                  "Invalid candidate image reference:\n" + "\n".join(invalid_references)
              )

          owned_names = {path.name for path in asset_files if path.name.startswith("figure-")}
          missing_assets = sorted(referenced_names - owned_names)
          if missing_assets:
              raise SystemExit(
                  "Candidate image asset is missing: " + repr(missing_assets)
              )
          if sum(path.stat().st_size for path in asset_files) > 100 * 1024 * 1024:
              raise SystemExit("Generated assets exceed 100 MiB in total")

          Image.MAX_IMAGE_PIXELS = 50_000_000
          warnings.simplefilter("error", Image.DecompressionBombWarning)
          formats_by_suffix = {
              ".jpeg": "JPEG",
              ".jpg": "JPEG",
              ".png": "PNG",
              ".webp": "WEBP",
          }
          invalid_images = []
          for path in asset_files:
              try:
                  with Image.open(path) as image:
                      if image.format != formats_by_suffix[path.suffix.lower()]:
                          raise ValueError(
                              f"content format {image.format!r} does not match suffix"
                          )
                      width, height = image.size
                      if width <= 0 or height <= 0 or width * height > 50_000_000:
                          raise ValueError(f"unsafe dimensions: {width}x{height}")
                      image.verify()
              except Exception as exc:
                  invalid_images.append(f"{path}: {exc}")
          if invalid_images:
              raise SystemExit(
                  "Generated asset is not a valid image:\n" + "\n".join(invalid_images)
              )
          PY

      - name: Commit generated changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- automation/pdf-figure-worker/output/candidates.json
          if [[ -d assets/yolo-research/auto ]]; then
            git add -- assets/yolo-research/auto
          fi

          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update PDF figure candidates"
          basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$basic_auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" \
            push origin HEAD:main
